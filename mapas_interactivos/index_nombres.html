<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Departamentos con Nombres</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 10px 16px;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    header .inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 14px;
    }

    #status {
      font-size: 13px;
      color: #555;
    }

    #map {
      flex: 1;
      position: relative;
    }

    #map-inset {
      position: absolute;
      bottom: 200px;
      left: 400px;
      width: 180px;
      height: 180px;
      z-index: 1000;
      border: 2px solid #ccc;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      background: #fff;
    }

    .leaflet-container {
      background: #f9fafb;
    }

    /* Estilos para las etiquetas de nombres */
    .dept-label {
      font-size: 12px;
      font-weight: 600;
      color: #1f2937;
      text-shadow: 
        -1px -1px 0 #fff,  
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff,
        -2px -2px 3px rgba(255,255,255,0.8),
         2px  2px 3px rgba(255,255,255,0.8);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Departamentos de Colombia</h1>
      <div class="inputs">
        <div id="status">Cargando datos...</div>
      </div>
    </header>

    <div id="map">
      <div id="map-inset"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

  <script src="map_nombres.js"></script>
</body>
</html>
