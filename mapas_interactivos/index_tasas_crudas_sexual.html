<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Tasas Crudas por Departamento - Violencia Sexual</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 10px 16px;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    header .inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 14px;
    }

    .file-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-input-group label {
      font-weight: 600;
    }

    .file-input-group input[type="file"] {
      font-size: 13px;
    }

    #status {
      font-size: 13px;
      color: #555;
    }

    #map {
      flex: 1;
      position: relative; /* Para posicionar el inset */
    }

    #map-inset {
      position: absolute;
      bottom: 200px;
      left: 400px;
      width: 180px;
      height: 180px;
      z-index: 1000;
      border: 2px solid #ccc;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      background: #fff;
    }

    .leaflet-container {
      background: #f9fafb;
    }

    .info.legend {
      padding: 6px 10px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      border-radius: 4px;
      line-height: 1.2;
      font-size: 12px;
    }

    .info.legend .title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info.legend i {
      width: 16px;
      height: 10px;
      float: left;
      margin-right: 5px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Tasas Crudas por Departamento - Violencia Sexual</h1>
      <div class="inputs">
        <div id="status">Cargando datos...</div>
      </div>
    </header>

    <div id="map">
      <div id="map-inset"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <script src="map_tasa_crudas_sexual.js"></script>
</body>
</html>
